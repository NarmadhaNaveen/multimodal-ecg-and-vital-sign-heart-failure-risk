experiment:
  name: "vitaldb_perioperative_hf_risk"
  seed: 42
  device: "cuda"
  output_dir: "outputs/vitaldb"
  checkpoint_dir: "checkpoints/vitaldb"

data:
  dataset_name: "vitaldb"
  raw_dir: "data/raw/vitaldb"
  processed_dir: "data/processed/vitaldb"
  
  # Temporal window definitions
  context_window_sec: 600        # 10 minutes perioperative observation window
  prediction_horizon_sec: 7200    # 2 hours post-window acute cardiovascular instability / acute failure
  
  # Sampling parameters
  ecg_sampling_rate: 200         # VitalDB SNUADC/Solar8000 resampled ECG (200 Hz)
  vital_sampling_rate: 1          # 1 Hz vital track data
  
  ecg_channels: ["ECG_II", "ECG_V5"]
  vital_channels: ["HR", "ART_SBP", "ART_DBP", "ART_MBP", "SPO2", "RR"]
  
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

  label_definition:
    primary_endpoint: "acute_perioperative_cardiac_decompensation"
    clinical_criteria:
      sustained_hypotension_map_under_55: true
      inotropic_vasopressor_escalation: true
      postoperative_troponin_elevation_or_hf_diagnosis: true
      icu_transfer_due_to_pump_failure: true

model:
  architecture: "multimodal_transformer_cross_attn"
  num_classes: 1
  ecg_encoder:
    in_channels: 2
    conv_channels: [32, 64, 128, 256]
    kernel_sizes: [7, 7, 5, 3]
    stride_downsample: [4, 4, 4, 2]
    dropout: 0.2
    proj_dim: 128
  vital_encoder:
    in_channels: 6
    num_channels: [32, 64, 128]
    kernel_size: 3
    dilation_schedule: [1, 2, 4, 8]
    dropout: 0.2
    proj_dim: 128
    use_missingness_indicator: true
  transformer:
    d_model: 128
    nhead: 4
    num_layers: 3
    dim_feedforward: 256
    dropout: 0.1
    max_seq_len: 1024
  cross_attention:
    embed_dim: 128
    num_heads: 4
    dropout: 0.1
    fusion_gate: true
  foundation:
    use_foundation_init: false
    foundation_model_name: "chronos-t5-base"

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 25
  patience: 6
  grad_clip_norm: 1.0
  mixed_precision: true
  num_workers: 0
  pos_weight: 3.5

evaluation:
  batch_size: 16
  bootstrap_ci_samples: 1000
  confidence_level: 0.95
  ece_bins: 10
  temperature_scaling: true
  target_metrics:
    auroc: 0.958
    auprc: 0.931
    accuracy: 0.956
    f1_score: 0.936
    ece_before: 0.036
    ece_after: 0.022
