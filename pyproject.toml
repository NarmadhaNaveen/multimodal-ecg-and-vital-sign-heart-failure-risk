[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-heart-failure-ai"
version = "0.1.0"
description = "Foundation-Guided Multimodal Temporal Learning for Short-Horizon Heart-Failure Risk Stratification Using ECG and Vital Signs"
readme = "README.md"
authors = [{ name = "AI/ML Research Team" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "wfdb>=4.1.0",
    "vitaldb>=1.4.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "tqdm>=4.66.0"
]

[project.scripts]
ecg-smoke = "scripts.run_smoke_test:main"
ecg-train = "scripts.train:main"
ecg-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
